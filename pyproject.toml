[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bist-tavan-hunter"
version = "0.1.0"
description = "BIST pre-limit-up research, scoring and backtesting platform"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
agents = [
    "claude-agent-sdk>=0.2,<0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# CI enforces correctness-oriented checks. Legacy style/modernization rules
# remain outside the CI gate until the repository is migrated incrementally.
select = ["E4", "E7", "E9", "F"]
