name: Bits100 Research Loop

on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * 1'

jobs:
  research:
    if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[agents]'
      - name: Scout -> Quant -> Audit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/run_research_loop.py
      - uses: actions/upload-artifact@v4
        with:
          name: bits100-research-loop
          path: research_loop_report.md
