name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Compile package
        run: python -m compileall -q src tests
      - name: Pytest
        run: pytest -q
      - name: Ruff
        run: ruff check src
      - name: Production guard
        run: python -c "from bist_hunter.paper_trading import PaperBroker; print('paper-trading guard OK')"
