name: Tavan DNA Historical Training

on:
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * 6'

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - name: Build real historical dataset and train
        env:
          BIST_SYMBOLS: ${{ secrets.BIST_SYMBOLS }}
        run: |
          python - <<'PY'
          import json
          from datetime import UTC, date, timedelta
          from bist_hunter.real_adapters import load_symbol_universe, yahoo_chart
          from bist_hunter.tavan_model import build_tavan_dataset, chronological_train_test
          import pandas as pd
          symbols = load_symbol_universe()
          end = date.today()
          rows = []
          for symbol in symbols:
              rows.extend(yahoo_chart(symbol, end - timedelta(days=3650), end))
          result = chronological_train_test(build_tavan_dataset(pd.DataFrame(rows)))
          print(json.dumps(result.__dict__ if hasattr(result, '__dict__') else {
              'train_rows': result.train_rows, 'test_rows': result.test_rows,
              'test_precision': result.test_precision, 'test_recall': result.test_recall,
              'coefficients': result.coefficients
          }, indent=2))
          PY
