name: Tavan DNA Historical Training

on:
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * 6'

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - name: Build real historical dataset and train
        env:
          BIST_SYMBOLS: ${{ secrets.BIST_SYMBOLS }}
          BIST_UNIVERSE_URL: ${{ secrets.BIST_UNIVERSE_URL }}
          BIST_HISTORICAL_API_URL: ${{ secrets.BIST_HISTORICAL_API_URL }}
          BIST_DATA_API_KEY: ${{ secrets.BIST_DATA_API_KEY }}
        run: |
          python - <<'PY'
          import json
          from datetime import date, timedelta
          import pandas as pd
          from bist_hunter.real_adapters import historical_bars, load_symbol_universe
          from bist_hunter.tavan_model import build_tavan_dataset, chronological_train_test
          symbols = load_symbol_universe()
          end = date.today()
          rows = []
          failures = []
          for symbol in symbols:
              try:
                  rows.extend(historical_bars(symbol, end - timedelta(days=3650), end))
              except Exception as exc:
                  failures.append(f'{symbol}: {exc}')
          if not rows:
              raise SystemExit('No historical data returned for the configured universe')
          result = chronological_train_test(build_tavan_dataset(pd.DataFrame(rows)))
          print(json.dumps({'universe': len(symbols), 'rows': len(rows), 'failed_symbols': len(failures), 'train_rows': result.train_rows, 'test_rows': result.test_rows, 'test_precision': result.test_precision, 'test_recall': result.test_recall, 'coefficients': result.coefficients}, indent=2))
          if failures:
              print('First failures:', *failures[:10], sep='\n')
          PY
